 <div id="img-container">
 </div>
 <script>
  function postpic(stuff) {
   var node = document.createElement("img");
   node.src = "/portfolio_photos/" + stuff.name;
   node.loading = "lazy";
   node.style="max-width: 100%;";
   document.getElementById("img-container").appendChild(node);
  }
  function loadFile(filePath) {
    var result = null;
    var xmlhttp = new XMLHttpRequest();
    xmlhttp.open("GET", filePath, false);
    xmlhttp.send();
    if (xmlhttp.status==200) {
   result = xmlhttp.responseText;
    }
    return result;
  }
  const pics = JSON.parse(loadFile("/photos.json"));
  const dir = pics[0].contents;
  dir.forEach(postpic);
 </script>
